
<!DOCTYPE html>
<!-- Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page. -->

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head">
  <title id="pageTitle" th:text="${session.title}">Task List</title>
</head>

<body>

<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container my-4">

  <h2 class="mb-3 text-center title">Task List</h2>

  <!-- Error message -->
  <h2 class="mb-3 text-center error"
      th:if="${not #strings.isEmpty(messageError)}"
      th:text="${messageError}">
    Message from controller
  </h2>

  <!-- Success message -->
  <h2 class="mb-3 text-center success"
      th:if="${not #strings.isEmpty(messageSuccess)}"
      th:text="${messageSuccess}">
    Message success from controller
  </h2>

  <div class="table-responsive">

    <table id="theData"
           class="table table-striped table-hover align-middle">

      <thead class="table-dark text-center">
      <tr>
        <th>ID</th>
        <th>Task Name</th>
        <th>Description</th>
        <th>Due Date</th>
        <th>Estimated Time</th>
        <th>Status</th>
        <th>Notes</th>
        <th>Category</th>
        <th>Priority</th>
        <th>Priority Score</th>
        <th>Options</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="current : ${tasks}">

        <td th:text="${current.id}"></td>
        <td th:text="${current.taskName}"></td>
        <td th:text="${current.description}"></td>
        <td th:text="${current.dueDate}"></td>
        <td th:text="${current.estimatedTime}"></td>
        <td th:text="${current.status}"></td>
        <td th:text="${current.notes}"></td>
        <td th:text="${current.category}"></td>
        <td th:text="${current.priority}"></td>
        <td th:text="${current.priorityScore}"></td>

        <td class="text-center">
          <div class="btn-group" role="group">

            <!-- Edit task -->
            <a th:href="@{/task/edit/{id}(id=${current.id})}"
               class="btn btn-sm btn-outline-primary"
               title="Edit">
              <i class="accent fas fa-edit"></i>
            </a>

            <!-- Delete task -->
            <a th:href="@{/task/delete/{id}(id=${current.id})}"
               class="btn btn-sm btn-outline-danger"
               title="Delete">
              <i class="accent fas fa-trash"></i>
            </a>

          </div>
        </td>

      </tr>

      <!-- Message when no data exists -->
      <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="11"
            class="text-center text-muted py-4">
          No tasks found.
        </td>
      </tr>

      </tbody>

    </table>

  </div>

  <!-- Add new task button -->
  <div class="text-center mt-3">
    <a th:href="@{/task/add}"
       href="/task/add"
       class="accent accent-background btn btn-success">

      <i class="fas fa-plus"></i>
      Add New Task

    </a>
  </div>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
