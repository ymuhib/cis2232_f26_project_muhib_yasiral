<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head">
  <title id="pageTitle" th:text="${session.title}">Task List</title>
</head>

<body>

<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container my-4">

  <h2 class="mb-3 text-center title">Task List for Edit</h2>

  <h2 class="mb-3 text-center error"
      th:if="${not #strings.isEmpty(messageError)}"
      th:text="${messageError}">
    Message from controller
  </h2>

  <h2 class="mb-3 text-center success"
      th:if="${not #strings.isEmpty(messageSuccess)}"
      th:text="${messageSuccess}">
    Message success from controller
  </h2>

  <div class="table-responsive">

    <form action="#"
          th:action="@{/task/list/edit/submit}"
          th:object="${form}"
          method="post">

      <fieldset>

        <input type="submit" id="submitButton" th:value="Save">
        <input type="reset" id="resetButton" name="reset" th:value="Reset"/>

        <table class="table table-striped table-hover align-middle">

          <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Task Name</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Estimated Time</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Category</th>
            <th>Priority</th>

          </tr>
          </thead>

          <tbody>

          <tr th:each="current,itemStat : ${form.tasks}">

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].id}"/>
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].taskName}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].description}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].dueDate}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].estimatedTime}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].status}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].notes}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].category}">
            </td>

            <td>
              <input th:field="*{tasks[__${itemStat.index}__].priority}">
            </td>


          </tr>

          <!-- Message when no data -->
          <tr th:if="${#lists.isEmpty(form.tasks)}">
            <td colspan="10" class="text-center text-muted py-4">
              No tasks found
            </td>
          </tr>

          </tbody>

        </table>

      </fieldset>

    </form>

  </div>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
